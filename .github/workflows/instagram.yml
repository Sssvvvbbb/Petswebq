name: Actualizar feed de Instagram

on:
  schedule:
    # Corre cada día a las 06:00 UTC (03:00 hora Chile)
    - cron: "0 6 * * *"
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar feed de Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python update_instagram.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram.json Assets/instagram/
          # Solo hace commit si hay cambios reales
          git diff --cached --quiet || git commit -m "chore: actualizar feed Instagram $(date -u '+%Y-%m-%d')"
          git push
