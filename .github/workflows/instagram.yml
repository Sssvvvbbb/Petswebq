name: Actualizar feed de Instagram

on:
  schedule:
    # Corre cada 12 horas: 06:00 y 18:00 UTC (03:00 y 15:00 hora Chile)
    - cron: "0 6,18 * * *"
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar feed de Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python update_instagram.py

      - name: Commit y push si hay cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/instagram.json public/Assets/instagram/
          if git diff --cached --quiet; then
            echo "Sin cambios en el feed."
            exit 0
          fi
          git commit -m "chore: actualizar feed Instagram $(date -u '+%Y-%m-%d %H:%M')"
          # Trae los commits que se hayan subido mientras corría el bot, para que el push no falle
          git pull --rebase
          git push
          echo "publicar=si" >> "$GITHUB_OUTPUT"

      # Cloudflare omite los despliegues por push; el deploy hook sí publica (ver deploy.yml)
      - name: Publicar en Cloudflare
        if: steps.commit.outputs.publicar == 'si'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$CF_DEPLOY_HOOK" -o /dev/null
