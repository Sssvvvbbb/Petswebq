name: Actualizar feed de Instagram

on:
  schedule:
    # Corre cada 12 horas: 06:00 y 18:00 UTC (03:00 y 15:00 hora Chile)
    - cron: "0 6,18 * * *"
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

# Sin permisos por defecto: cada job pide solo lo que usa
permissions: {}

# Nunca dos actualizaciones a la vez (una manual y la programada)
concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # commit y push del feed
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar feed de Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python update_instagram.py

      - name: Commit y push si hay cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/instagram.json public/Assets/instagram/
          if git diff --cached --quiet; then
            echo "Sin cambios en el feed."
            exit 0
          fi
          git commit -m "chore: actualizar feed Instagram $(date -u '+%Y-%m-%d %H:%M')"
          # Trae los commits que se hayan subido mientras corría el bot, para que el push no falle
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Cloudflare omite los despliegues por push; el deploy hook sí publica (ver deploy.yml)
  publicar:
    needs: update-feed
    if: needs.update-feed.outputs.sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.update-feed.outputs.sha }}
    secrets:
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
